<div class="content">
  <section class="login-section">
    <h2>{{ isLogin ? 'Connexion' : 'Inscription' }}</h2>

    <form (ngSubmit)="onSubmit(isLogin)" #authForm="ngForm">
        <div *ngIf="!isLogin">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" [(ngModel)]="formData.nom" required>
        </div>

        <div *ngIf="!isLogin">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" [(ngModel)]="formData.prenom" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="formData.email">
        </div>

        <div>
          <label for="mdp">Mot de passe</label>
          <input type="password" id="mdp" name="mdp" [(ngModel)]="formData.password" required>
        </div>

        <button type="submit">{{ isLogin ? 'Se connecter' : "S'inscrire" }}</button>
      </form>

    <p class="signup-link">
      {{ isLogin ? "Pas encore de compte ?" : "Déjà un compte ?" }}
      <a (click)="toggleForm()" style="cursor:pointer;">
        {{ isLogin ? "Inscrivez-vous en cliquant ici" : "Connectez-vous ici" }}
      </a>
    </p>
  </section>
</div>
